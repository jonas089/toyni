[package]
name = "toyni"
version = "0.2.0"
edition = "2021"
build = "build.rs"
description = "A modular STARK library with roots-of-unity (BabyBear) and circle (M31) engines"
license = "MIT"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
circle = []
metal = ["circle", "dep:metal", "dep:objc"]
cuda = []

[dependencies]
rand = "0.8.5"
sha2 = "0.10.8"
rayon = { version = "1.10", optional = true }
metal = { version = "0.29", optional = true }
objc = { version = "0.2", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
